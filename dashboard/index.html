<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Radar — pre-token protocols ranked by implied launch value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <p class="kicker">Token Launch Radar</p>
    <h1>Every protocol with no token yet, priced as if it launched today.</h1>
    <p class="lede" id="lede">Reading the board…</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<section class="model-strip" id="model"></section>

<main>
  <section class="controls" aria-label="Board controls">
    <label class="ctl grow">Search
      <input id="q" type="search" placeholder="Protocol name or slug…">
    </label>
    <label class="ctl">Category
      <select id="cat"></select>
    </label>
    <label class="ctl">Chain
      <select id="chain"></select>
    </label>
    <label class="ctl">Sort by
      <select id="sort">
        <option value="rank">Implied value (rank)</option>
        <option value="tvl">TVL</option>
        <option value="growth">7-day growth</option>
        <option value="age">Longest tokenless</option>
      </select>
    </label>
    <label class="ctl check">
      <input id="watch" type="checkbox"> Watchlist only (the $50M+ floor)
    </label>
    <p class="count" id="count"></p>
  </section>

  <section class="board-wrap">
    <table class="board" id="board">
      <thead>
        <tr>
          <th class="num">#</th><th>Protocol</th><th>Category</th><th>Chains</th>
          <th class="num">TVL</th><th class="num">7d</th><th class="num">Tokenless</th>
          <th class="num">Peer ×</th><th class="num">Implied value</th><th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="empty" hidden>No protocol matches those filters. Loosen one and the radar sweeps again.</p>
  </section>

  <section class="detail" id="detail" hidden></section>

  <footer class="foot" id="foot"></footer>
</main>

<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
